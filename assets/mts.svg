<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 689.759 626.92">
  <defs>
    <style>
      .cls-1 {
        fill: #f2f2f2;
      }

      .cls-1, .cls-2, .cls-3, .cls-4, .cls-5 {
        stroke: #111;
        stroke-linecap: round;
      }

      .cls-1, .cls-2, .cls-3, .cls-5 {
        stroke-miterlimit: 10;
      }

      .cls-1, .cls-3, .cls-4, .cls-5 {
        stroke-width: 7px;
      }

      .cls-6 {
        fill: #444;
      }

      .cls-2 {
        stroke-width: 10px;
      }

      .cls-2, .cls-3, .cls-4 {
        fill: #dbd8d4;
      }

      .cls-4 {
        stroke-linejoin: round;
      }

      .cls-5 {
        fill: none;
      }

      .seat-back {
        fill: #c8c8c8;
        stroke: #111;
        stroke-width: 5px;
      }

      .seat-cushion {
        fill: #b8b8b8;
        stroke: #111;
        stroke-width: 5px;
      }

      @keyframes doorOpenLeftLoop {
        0% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-77.46px);
        }
        75% {
          transform: translateX(-77.46px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes doorOpenRightLoop {
        0% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(77.46px);
        }
        75% {
          transform: translateX(77.46px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes wheelSpin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .door-left {
        animation: doorOpenLeftLoop 4s ease-in-out infinite;
      }

      .door-right {
        animation: doorOpenRightLoop 4s ease-in-out infinite;
      }

      .wheel {
        animation: wheelSpin 2s linear infinite;
      }

      .wheel-left {
        transform-origin: 135.989px 512.456px;
      }

      .wheel-right {
        transform-origin: 551.811px 512.456px;
      }
    </style>
