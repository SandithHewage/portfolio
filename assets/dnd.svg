      @keyframes slideInNotification {
        0% {
          transform: translateY(-80px) scale(0.8);
          opacity: 0;
        }
        8% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        87% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translateY(0) scale(1);
          opacity: 0;
        }
      }

      .notification-group {
        transform-origin: 50% -50px;
        animation: slideInNotification 6.5s cubic-bezier(0.34, 1.87, 0.64, 1) infinite;
      }
    </style>
